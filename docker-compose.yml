version: '2.4'

services:
  nginx-server:
    build:
      context: ./web
      dockerfile : Dockerfile
    ports:
    - "80:80"
    - "443:443"
    volumes:
      - /etc/certificates:/etc/certificates
    depends_on:
      - back-end

  back-end:
    build: 
      context: ./server
      dockerfile: Dockerfile
    ports:
      - 4000:4000
    restart: always
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres} -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '6432:5432'
    volumes: 
      - ./server/dbdata:/var/lib/postgresql/data
